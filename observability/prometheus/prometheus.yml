# Prometheus: scrape the Collector and itself, evaluate ChessPulse alert rules.
#
# The Collector exposes application metrics on :8889 in Prometheus format; the
# OTel -> Prometheus name/label translation is documented in
# docs/observability.md. No remote-write, no paid retention: 7 days locally.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: chesspulse-app
    # Application metrics translated by the Collector's Prometheus exporter.
    static_configs:
      - targets: ["otel-collector:8889"]
