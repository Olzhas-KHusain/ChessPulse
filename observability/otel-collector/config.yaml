# OpenTelemetry Collector: one OTLP/HTTP receiver, three local backends.
#
#   traces  -> Tempo        (OTLP/HTTP)
#   metrics -> Prometheus   (pull: the collector exposes a Prometheus endpoint)
#   logs    -> Loki         (HTTP push API)
#
# The application sends to http://<host>:4318 (base URL); the OTel SDK appends
# /v1/traces, /v1/metrics and /v1/logs. gRPC is exposed for other clients.
#
# Free-tier note: the memory limiter keeps the collector from growing without
# bound on a small VM. It refuses new data instead of being OOM-killed.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 5s
    send_batch_size: 1024

exporters:
  # Tempo ingests OTLP directly.
  otlphttp/tempo:
    traces_endpoint: http://tempo:4318/v1/traces
    timeout: 10s

  # Prometheus scrapes this endpoint; the collector does not push metrics.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    metric_expiration: 5m

  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    timeout: 10s

  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: warn
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki, debug]
