# Render blueprint (PaaS deploy). Docs: https://render.com/docs/blueprint-spec
# The app image is built from the repository Dockerfile (static frontend +
# FastAPI). Both resources use the Free compute plan, so this blueprint does
# not enable paid features:
#   - Free web services spin down after 15 minutes without traffic and take
#     about a minute to wake up; they have 0.1 CPU / 512 MB RAM.
#   - Free PostgreSQL is 1 GB and expires 30 days after creation (upgrade or
#     recreate the database to keep the deployment alive).
# Render has no free background-worker plan, so the web service starts the
# analysis worker inside the same container via RUN_EMBEDDED_WORKER=1.
# For a durable free-tier deployment use the Compose stack on AWS
# (infra/cloudformation.yml) instead.

services:
  - type: web
    name: chesspulse-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # Production is promoted ONLY by .github/workflows/promote.yml, which calls
    # the Render API with an explicit commitId after a green CI run for that
    # SHA. A plain push to the branch must not deploy production.
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: chesspulse-db
          property: connectionString
      - key: POSTGRES_USER
        value: chesspulse
      - key: RUN_EMBEDDED_WORKER
        value: "1"
      - key: STOCKFISH_PATH
        value: /usr/games/stockfish
      # --- OpenTelemetry -----------------------------------------------------
      # Names and sampling are safe to commit. The endpoint and headers are
      # credentials for Grafana Cloud (or another OTLP backend): set them in the
      # Render dashboard, never in this file. With OTEL_ENABLED unset the app
      # runs without exporters.
      - key: OTEL_SERVICE_NAME
        value: chesspulse
      - key: OTEL_ENABLED
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "0.1"
      - key: OTEL_METRIC_EXPORT_INTERVAL_MS
        value: "30000"
      - key: OTEL_LOGS_ENABLED
        value: "true"

databases:
  - name: chesspulse-db
    databaseName: chesspulse
    user: chesspulse
    plan: free
