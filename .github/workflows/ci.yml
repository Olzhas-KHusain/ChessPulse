name: CI/CD

# Backend tests, frontend tests, Playwright e2e against the composed stack,
# then build/push the image and redeploy on every pushed commit.

on:
  push:
    branches: [main, chesspulse-mvp]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_PASSWORD: ci-postgres-password

jobs:
  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: chesspulse
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: chesspulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chesspulse"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://chesspulse:ci-postgres-password@localhost:5432/chesspulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: mypy .
      - run: pytest -q

  frontend:
    name: frontend (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    name: Playwright e2e (docker compose stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Copy .env for compose
        run: |
          cat > .env <<'EOF'
          POSTGRES_PASSWORD=e2e-postgres-password
          POSTGRES_USER=chesspulse
          POSTGRES_DB=chesspulse
          EOF
      - name: Start the full stack
        run: |
          docker compose up --build -d --wait || {
            echo "--- compose ps ---"
            docker compose ps -a
            echo "--- app logs ---"
            docker compose logs --tail=200 app worker
            exit 1
          }
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Wait for the app to be healthy
        run: curl --retry 30 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:8000/health
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_USERNAME: ${{ secrets.E2E_USERNAME || 'olzhaswlk' }}
      - name: Upload traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: frontend/test-results/

  deploy:
    name: build, push GHCR and redeploy
    runs-on: ubuntu-latest
    needs: [e2e]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chesspulse:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/chesspulse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Redeploy (Render / Railway deploy hook)
        # Optional: set RENDER_DEPLOY_HOOK or RAILWAY_DEPLOY_HOOK in repo secrets.
        # The image reference used by the PaaS service is ghcr.io/.../chesspulse:latest.
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK || secrets.RAILWAY_DEPLOY_HOOK }}
        if: env.HOOK != ''
        run: curl -fsS -X POST "${HOOK}"
      - name: Redeploy (self-hosted VM via CloudFormation template)
        # AWS deployment runs from infra/: see infra/README.md. Kept as a manual
        # step (oidc/data-id) so CI never needs long-lived AWS keys.
        run: echo "Deploy hook done; AWS stack update documented in infra/README.md"
