name: Promote to production

# The ONLY workflow that deploys production.
#
# A plain push to main never deploys production: render.yaml sets
# autoDeploy: false and ci.yml stops at building the image and (optionally)
# updating the development environment.
#
# Start it from the Actions tab. It:
#   1. requires the exact 40-character SHA on main and confirm=promote;
#   2. verifies that ci.yml concluded `success` for that SHA;
#   3. asks for approval through the `production` GitHub Environment
#      (configure required reviewers in Settings -> Environments);
#   4. calls the Render API POST /v1/services/{id}/deploys with commitId;
#   5. polls the deploy until it is live or failed and prints the result.
#
# Secrets: RENDER_API_KEY, RENDER_SERVICE_ID. Never put them in the repository.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character lowercase commit SHA on main"
        required: true
        type: string
      confirm:
        description: "Type promote to confirm the production deploy"
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: verify the commit has a green CI run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.checks.outputs.sha }}
    steps:
      - name: Validate inputs
        env:
          SHA: ${{ inputs.sha }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail

          if [ "$CONFIRM" != "promote" ]; then
            echo "::error::confirm must be exactly 'promote'"
            exit 1
          fi

          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::sha must be a full 40-character lowercase commit SHA"
            exit 1
          fi

      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          # status "identical" or "behind" means the commit is contained in main.
          # "ahead"/"diverged" means it is not (or main moved past it without it).
          relation=$(gh api "repos/${{ github.repository }}/compare/main...$SHA" --jq '.status')
          echo "main...$SHA relation: $relation"
          if [ "$relation" != "identical" ] && [ "$relation" != "behind" ]; then
            echo "::error::Commit $SHA is not an ancestor of main (relation: $relation)"
            exit 1
          fi

      - name: Require a successful CI run for this exact SHA
        id: checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          runs=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100")

          green=$(printf '%s' "$runs" \
            | jq -r '[.workflow_runs[]? | select(.event == "push") | select(.head_branch == "main") | select(.conclusion == "success")] | length')

          if [ "$green" -lt 1 ]; then
            echo "::error::No successful push-to-main CI run found for $SHA"
            printf '%s' "$runs" | jq -r '.workflow_runs[]? | "\(.event) \(.head_branch) \(.status) \(.conclusion) \(.html_url)"'
            exit 1
          fi

          echo "Verified a green push-to-main CI run for $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  deploy:
    name: deploy the verified commit on Render
    runs-on: ubuntu-latest
    needs: [verify]
    # Approval gate: add required reviewers to this Environment.
    environment: production
    timeout-minutes: 25
    steps:
      - name: Trigger a Render deploy for the exact commit
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "::error::RENDER_API_KEY and RENDER_SERVICE_ID must be set as repository secrets"
            exit 1
          fi

          response=$(curl -fsS --retry 3 --retry-connrefused \
            -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "{\"commitId\":\"$SHA\"}")

          deploy_id=$(printf '%s' "$response" | jq -r '.id // .deploy.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy id"
            printf '%s\n' "$response" | jq -r '{message: (.message // "no message")}'
            exit 1
          fi

          echo "DEPLOY_ID=$deploy_id" >> "$GITHUB_ENV"
          echo "Render accepted deploy $deploy_id for commit $SHA"
          echo "### Render deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- deploy id: \`$deploy_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the deploy result
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 90); do
            payload=$(curl -fsS \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json")
            status=$(printf '%s' "$payload" | jq -r '.status // .deploy.status // "unknown"')
            echo "attempt $attempt: $status"

            case "$status" in
              live)
                echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
                echo "Status: **live** for commit \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "Next: run the post-deploy checks in docs/deployment.md section 8." >> "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              build_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy finished with status: $status"
                echo "Status: **$status**" >> "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
            esac

            sleep 20
          done

          echo "::error::Timed out waiting for the Render deploy; check the Render dashboard"
          exit 1
