[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chesspulse-backend"
dynamic = ["version"]
description = "ChessPulse backend: FastAPI modular monolith"
requires-python = ">=3.12,<3.14"
# Direct dependencies are pinned to exact versions for reproducible environments.
# pydantic-settings: required for validated, environment-based configuration
# (the stack already uses Pydantic v2; this is its official settings companion).
dependencies = [
    "fastapi==0.149.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "SQLAlchemy==2.1.5",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    # Outbound HTTP to the Chess.com PubAPI (AGENT.md stack); also used by TestClient.
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
    "mypy==2.4.0",
]

[tool.setuptools.dynamic]
version = { attr = "app.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a reachable PostgreSQL instance (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "migrations"]
