# Local development services only. The backend and frontend run on the host.
name: chesspulse

services:
  db:
    image: postgres:16.9-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chesspulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-chesspulse}
    ports:
      # Bound to localhost only: the database is not exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chesspulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chesspulse_pgdata:
